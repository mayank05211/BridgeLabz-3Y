<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Cards</title>
  <style>
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #f5f6fa; margin: 0; padding: 24px; color: #1f2430; }
    #product-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .product-card { background: #fff; border: 1px solid #d9dde7; border-radius: 10px; padding: 14px; }
    .product-card img { width: 100%; height: 180px; object-fit: contain; }
    .product-card h3 { font-size: 0.95rem; margin: 10px 0 6px; }
    .price { font-weight: 700; margin: 0; }
    #error-message { color: #d6336c; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Products</h1>
  <p id="error-message"></p>
  <div id="product-container"></div>
  <script src="q6.js"></script>
</body>
</html>
