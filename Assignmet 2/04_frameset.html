<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>

<!-- The frameset divides the page into a top navigation frame and a bottom content frame. -->
<frameset rows="25%,75%">
    <frame src="navigation.html" name="navigation" title="Navigation">
    <frame src="welcome.html" name="content" title="Welcome Message">
</frameset>
</html>
