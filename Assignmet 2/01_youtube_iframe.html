<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YouTube Video Embed</title>
</head>
<body>
    <h1>YouTube Video</h1>
    <!-- The iframe embeds a YouTube video and uses percentage dimensions. -->
    <iframe
        width="100%"
        height="50%"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="YouTube Video">
    </iframe>
</body>
</html>
