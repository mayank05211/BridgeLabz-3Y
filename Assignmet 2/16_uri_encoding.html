<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding</h1>

    <p>Original URL:</p>
    <p>https://example.com/search?query=HTML &amp; CSS</p>

    <p>Encoded URL:</p>
    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search for HTML and CSS
    </a>
</body>
</html>
