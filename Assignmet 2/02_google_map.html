<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google Map</title>
</head>
<body>
    <h1>Map of Mathura</h1>

    <!-- loading="lazy" delays loading the iframe until it is close to the visible area. -->
    <iframe
        title="Google Map showing Mathura"
        width="600"
        height="450"
        src="https://www.google.com/maps?q=Mathura%2C%20India&output=embed"
        loading="lazy">
    </iframe>
</body>
</html>
