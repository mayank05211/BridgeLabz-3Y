<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadows and Depth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Shadows & Depth</h1>
    <div class="cards">
      <article class="card soft"><h2>Soft Shadow</h2><p>A subtle shadow creates a lightweight depth effect.</p></article>
      <article class="card hard"><h2>Strong Shadow</h2><p>A stronger shadow gives the card more visual separation.</p></article>
      <article class="card spread"><h2>Wide Shadow</h2><p>A wide shadow creates a floating content effect.</p></article>
    </div>
  </main>
</body>
</html>
