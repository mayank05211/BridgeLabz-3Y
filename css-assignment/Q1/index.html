<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Borders and Padding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Borders & Padding Demonstration</h1>
    <div class="boxes">
      <article class="box solid"><h2>Solid</h2><p>10px padding</p></article>
      <article class="box dashed"><h2>Dashed</h2><p>20px padding</p></article>
      <article class="box double"><h2>Double</h2><p>30px padding</p></article>
      <article class="box groove"><h2>Groove</h2><p>15px padding</p></article>
      <article class="box rounded"><h2>Rounded</h2><p>25px padding + radius</p></article>
    </div>
  </main>
</body>
</html>
