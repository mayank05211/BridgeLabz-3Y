<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Navigation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a class="active" href="#home">Home</a>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#blog">Blog</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section id="home"><h1>Welcome</h1><p>A responsive navigation bar with smooth hover transitions.</p></section>
    <section id="about"><h2>About</h2><p>Learn more about our work.</p></section>
    <section id="services"><h2>Services</h2><p>Explore our services.</p></section>
    <section id="blog"><h2>Blog</h2><p>Read our latest articles.</p></section>
    <section id="contact"><h2>Contact</h2><p>Get in touch with us.</p></section>
  </main>

  <footer><p>&copy; 2026 Responsive Navigation Demo</p></footer>
</body>
</html>
