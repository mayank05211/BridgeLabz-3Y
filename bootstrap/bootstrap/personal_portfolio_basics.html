<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal Portfolio Basics built with Bootstrap 5">
  <title>Personal Portfolio Basics</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="personal_portfolio_basics.css">\n</head>\n<body>\n<header class="bg-light text-dark text-center py-5">
  <div class="container">
    <img class="profile-photo img-fluid rounded-circle mb-3" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400" alt="Professional profile portrait">
    <h1 class="fw-bold">Alex Morgan</h1>
    <p class="lead mb-0">Frontend Developer · Creative Problem Solver</p>
  </div>
</header>
<main class="container py-5">
  <section class="text-center mb-5">
    <h2 class="fw-bold">Hello, I'm Alex</h2>
    <p class="text-secondary mx-auto intro-copy">I build accessible, responsive websites and enjoy turning complex ideas into simple digital experiences.</p>
    <a class="btn btn-primary me-2 mt-3" href="#contact">Hire Me</a>
    <a class="btn btn-outline-dark mt-3" href="#contact">Download CV</a>
  </section>
  <section id="contact" class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <h2 class="h3 text-center mb-3">Get in touch</h2>
      <form>
        <label class="form-label" for="visitor-name">Your name</label><input class="form-control mb-3" id="visitor-name" type="text" placeholder="Enter your name">
        <label class="form-label" for="visitor-email">Email address</label><input class="form-control mb-3" id="visitor-email" type="email" placeholder="name@example.com">
        <label class="form-label" for="visitor-message">Message</label><textarea class="form-control mb-3" id="visitor-message" rows="3" placeholder="How can I help?"></textarea>
        <button class="btn btn-primary w-100" type="submit">Send Message</button>
      </form>
    </div>
  </section>
</main>
<footer class="text-center py-4 bg-light"><p class="mb-0">© 2026 Alex Morgan · Portfolio</p></footer>\n</body>\n</html>\n
