<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive Image Filter Gallery built with semantic HTML and responsive CSS">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive_image_filter_gallery.css">
</head>
<body>
<header><h1>Responsive Image Filter Gallery</h1><p>Six images with different CSS filters. Hover to reveal the original image.</p></header>
<main class="gallery">
<figure><img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=700" alt="Mountain landscape"><figcaption>Blur</figcaption></figure>
<figure><img class="grayscale" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=700" alt="Lake and mountains"><figcaption>Grayscale</figcaption></figure>
<figure><img class="sepia" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=700" alt="Ocean beach"><figcaption>Sepia</figcaption></figure>
<figure><img class="brightness" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=700" alt="Green forest"><figcaption>Brightness</figcaption></figure>
<figure><img class="contrast" src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=700" alt="Snowy mountain"><figcaption>Contrast</figcaption></figure>
<figure><img class="hue" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=700" alt="Sunrise over hills"><figcaption>Hue Rotate</figcaption></figure>
</main><footer><p>CSS filters gallery</p></footer>
</body>
</html>
