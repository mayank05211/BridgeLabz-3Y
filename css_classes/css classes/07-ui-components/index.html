<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UI Components using semantic HTML5 and CSS only">
  <title>UI Components</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>UI Components</h1><p>A compact search and selection interface.</p></header>
<main class="ui-card">
  <label for="site-search">Search the site</label>
  <input id="site-search" type="search" placeholder="Type a keyword...">
  <div class="actions"><button class="search-btn">Search</button><button class="clear-btn" type="reset">Clear</button></div>
  <label for="category">Choose a category</label>
  <select id="category"><option value="">Select category</option><option>Technology</option><option>Education</option><option>Design</option></select>
  <p class="hint">Focus the input or select menu, or hover over a button to see its state.</p>
</main>
<footer><p>Simple interface built with HTML and CSS.</p></footer>
</body>
</html>
