<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Tooltip Demonstration using semantic HTML5 and CSS only">
  <title>CSS Tooltip Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>CSS Tooltip Gallery</h1><p>Hover over each item to reveal its tooltip.</p></header>
<main class="tooltip-row">
  <div class="tip-wrap"><span class="tip-item">Home</span><span class="tooltip">Go to the home page</span></div>
  <div class="tip-wrap"><span class="tip-item">Search</span><span class="tooltip">Find something quickly</span></div>
  <div class="tip-wrap"><span class="tip-item">Profile</span><span class="tooltip">View your profile</span></div>
  <div class="tip-wrap"><span class="tip-item">Help</span><span class="tooltip">Get help and support</span></div>
</main>
<footer><p>Tooltips are created with CSS only—no JavaScript.</p></footer>
</body>
</html>
