<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Combined CSS Effects using semantic HTML5 and CSS only">
  <title>Combined CSS Effects</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Combined CSS Effects</h1><p>Hover, focus, active, transition, and transform together.</p></header>
<main class="effect-row">
  <article class="effect-card"><span class="symbol">✦</span><h2>Explore</h2><p>Move your pointer over the button.</p><button>Explore more</button></article>
  <article class="effect-card"><span class="symbol">★</span><h2>Discover</h2><p>Use Tab to focus the button.</p><button>Discover now</button></article>
  <article class="effect-card"><span class="symbol">♥</span><h2>Connect</h2><p>Press and hold to see the active state.</p><button>Connect</button></article>
</main>
<footer><p>Small transformations make interactions feel responsive.</p></footer>
</body>
</html>
