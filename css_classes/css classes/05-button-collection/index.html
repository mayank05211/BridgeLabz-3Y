<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Styled Button Collection using semantic HTML5 and CSS only">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Button Collection</h1><p>Four button styles with interactive states.</p></header>
<main class="button-panel">
  <button class="btn primary">Primary</button>
  <button class="btn secondary">Secondary</button>
  <button class="btn outline">Outline</button>
  <button class="btn disabled" disabled>Disabled</button>
</main>
<footer><p>Tab to a button to see its focus outline; press and hold to see its active state.</p></footer>
</body>
</html>
