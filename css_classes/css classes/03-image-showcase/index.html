<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Responsive Image Showcase using semantic HTML5 and CSS only">
  <title>Responsive Image Showcase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Image Showcase</h1><p>A responsive gallery with hover effects and captions.</p></header>
<main class="gallery">
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=800" alt="Mountain landscape"></div><figcaption>Mountain Escape</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=800" alt="Lake and mountains"></div><figcaption>Quiet Lake</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800" alt="Ocean beach"></div><figcaption>Ocean Breeze</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800" alt="Sunlight in a forest"></div><figcaption>Forest Walk</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800" alt="Snowy mountain under stars"></div><figcaption>Starlit Peaks</figcaption></figure>
  <figure><div class="image-wrap"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=800" alt="Sunrise over hills"></div><figcaption>Golden Sunrise</figcaption></figure>
</main>
<footer><p>Six views of the outdoors</p></footer>
</body>
</html>
