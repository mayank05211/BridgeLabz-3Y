<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CSS Animation Demonstration using semantic HTML5 and CSS only">
  <title>CSS Animation Demonstration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>CSS Animations</h1><p>Three animations created with keyframes.</p></header>
<main class="animation-stage">
  <section class="animation-card"><div class="moving-box"></div><h2>Moving box</h2><p>Slides from left to right and repeats.</p></section>
  <section class="animation-card"><div class="ball"></div><h2>Bouncing ball</h2><p>Bounces continuously with alternate direction.</p></section>
  <section class="animation-card"><p class="color-text">Color in motion</p><h2>Color-changing text</h2><p>Changes color after a short delay.</p></section>
</main>
<footer><p>Animations use CSS @keyframes.</p></footer>
</body>
</html>
