<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Validation</title>
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:0 16px}
label{display:block;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:9px}

</form>
<p id="loginMessage" aria-live="polite"></p>
<script src="Q7_Login_Form_Validation.js"></script></body></html>
