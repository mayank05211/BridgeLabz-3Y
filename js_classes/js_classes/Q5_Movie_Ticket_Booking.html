<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Ticket Booking</title>
<style>body{font-family:Arial,sans-serif;max-width:520px;margin:30px auto;padding:0 16px}
label{display:block;margin:12px 0 5px}input{width:100%;box-sizing:border-box;padding:9px}
button{margin-top:16px;padding:10px 18px}pre{white-space:pre-wrap}</style>
</head>
<body><h1>Movie Ticket Booking</h1>
<form id="bookingForm">
<label>Name <input name="name" required></label>
<label>Email <input name="email" type="email" required></label>
<label>Seats (1–10) <input name="seats" type="number" min="1" max="10" required></label>
<button type="submit">Book Tickets</button>
</form>
<pre id="bookingOutput" aria-live="polite"></pre>
<script src="Q5_Movie_Ticket_Booking.js"></script></body></html>
